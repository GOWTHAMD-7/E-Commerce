spring.application.name=e.commerce

# Suppress Spring Security auto-generated password warning
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Suppress open-in-view warning - keep true to allow lazy loading during serialization
spring.jpa.open-in-view=true
spring.config.import=optional:file:.env
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${DB_PASSWORD}


spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Explicitly set PostgreSQL dialect so Hibernate doesn't fail resolving it from the URL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Required for Neon SSL connections
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# JWT Configuration
jwt.expiration=3600000
#jwt.secret=Q9vK2mL8xT4pR7sN1wZ6yF3aJ8uD5gH2eB9cX4rP7qL1nM6tV2kS8uY5iC3oW9zA

jwt.secret=${JWT_SECRET}

brevo.api.key=${BREVO_API_KEY}
brevo.sender.email=${MAIL_USERNAME}
brevo.sender.name=E-Commerce Team

# Hugging Face Inference API token (optional - increases rate limit from 1k to 30k req/day)
# Get a free token at: https://huggingface.co/settings/tokens
huggingface.api.token=${HF_API_TOKEN:}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
